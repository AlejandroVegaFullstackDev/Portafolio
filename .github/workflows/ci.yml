# CI: cada push y PR pasa por tipos, build y tests. Lighthouse corre aparte y
# solo informa (no bloquea): el presupuesto se ajusta con datos reales.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (astro check)
        run: npm run check
      - name: Build
        run: npm run build
      - name: Tests (datos, CV, smoke del home)
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/client
          retention-days: 3

  lighthouse:
    name: Lighthouse (informativo)
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/client
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
